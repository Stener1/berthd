name: Shipyard
options:
  bundleIdPrefix: dev.shipyard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Shipyard:
    type: application
    platform: iOS
    sources:
      - Shipyard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Shipyard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Shipyard scans the pairing code that Shipyard shows in Settings > Phone.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Shipyard talks to your boxes on your tailnet.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Shipyard/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Shipyard
            CFBundleURLSchemes: [shipyard]
        # Plain HTTP to boxes on the tailnet. NSAllowsLocalNetworking lifts ATS
        # for IP-address hosts (a tailnet 100.x address) and unqualified or
        # .local names; the ts.net exception lifts it for MagicDNS names
        # only. Every other host keeps ATS, so nothing else goes over HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  ShipyardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShipyardTests
    dependencies:
      - target: Shipyard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shipyard:
    build:
      targets:
        Shipyard: all
    test:
      targets:
        - ShipyardTests
