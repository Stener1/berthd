name: release-cache

# Keeps the caches a release builds from warm on main, where a release's run
# (release.yml, on a tag) finds them: a tag's run reads main's caches, not
# other tags', and CI runs on pull requests, whose caches no tag sees.
#
#   mac:   the Go build cache for the Mac's binaries (berth-cli, berthd, the
#          Linux berthds it carries), and the Rust dependencies of the
#          universal app (Apple silicon and Intel)
#   linux: the Rust dependencies of the Linux app's release build
#
# Each builds what the release builds, the same way, without signing or
# bundling. It runs when the dependencies change, and twice a week: GitHub
# drops a cache nobody has read for seven days.
on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - app/src-tauri/Cargo.toml
      - app/src-tauri/Cargo.lock
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # A new entry each run, so the newest code's packages are what a
      # release restores (by the go-mac-release- prefix).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-mac-release-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-mac-release-${{ hashFiles('go.sum') }}-
            go-mac-release-
      - name: Build the Go binaries the app carries
        run: |
          set -euo pipefail
          # As make app-binaries does for universal-apple-darwin, and its
          # daemons target; the version stamp only changes the link.
          out="$RUNNER_TEMP/go"
          make daemons BIN="$out" TMUX=0
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -o "$out/berth-cli-$arch" ./cmd/berth
            GOOS=darwin GOARCH=$arch go build -trimpath -o "$out/berthd-$arch" ./cmd/berthd
          done
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: mac-release
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # The release's build (scripts/mac-release.sh, make app-build), with
      # its features, for both architectures; no bundle, no signing.
      - name: Build the app's Rust
        working-directory: app
        run: pnpm tauri build --target universal-apple-darwin --no-bundle

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: linux-release
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # The release build of the Linux app (scripts/linux-release.sh), no
      # bundles.
      - name: Build the app's Rust
        working-directory: app
        run: pnpm tauri build --no-bundle
