name: release

# A v* tag builds berthd and berth for every platform install.sh and the CLI
# support, and attaches the archives and checksums.txt to the tag's GitHub
# release (creating it when scripts/publish.sh has not already). Then the
# macos job builds the desktop app, universal, signed with the Developer ID,
# notarized and stapled (scripts/mac-release.sh), and adds the dmg, the
# updater archive and latest.json, the feed installed apps update from. No
# asset name carries a version, so releases/latest/download/<name> always
# finds the newest. The checks job (all of ci.yml) runs alongside the builds,
# and the feed job publishes nothing unless it passes: until then the release
# is a draft, which releases/latest/download/ and installed apps never see.
# The release job runs on omarchy, the owner's self-hosted runner
# (ci/runner/), when the repository variable SELF_HOSTED is true.
#
# The builds start from caches release-cache.yml keeps warm on main (a tag's
# run reads main's caches, not other tags'): the Mac's Go build cache, and
# the Rust dependencies of the Mac and Linux apps.
#
# The linux job builds the Linux desktop app, an alpha, for x86_64 on a
# hosted Ubuntu runner (scripts/linux-release.sh): an AppImage, which updates
# itself, and a .deb. It uploads them and keeps its entries for latest.json
# as a workflow artifact. The feed job, after both, merges those into the
# Mac's latest.json (scripts/merge-feed.py), only once the Linux bundles are
# on the release, and last makes the release "latest". The Mac and Linux
# jobs can finish in either order; a failed Linux build leaves the Mac's feed
# as it is, and the release still goes out. arm64 Linux could follow on a
# ubuntu-24.04-arm runner.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI (ci.yml: Go with -race and a real Chromium, shellcheck, the
  # app's checks, tests, build and Playwright suite, the docs build) on the
  # tagged commit. It runs while the release is built; nothing is published
  # unless it passes (the feed job), so a release needs no test run on a
  # laptop. A failure leaves a draft, which nobody is offered.
  checks:
    uses: ./.github/workflows/ci.yml

  # Shipyard's static tmux for Linux boxes, which berth and the app carry for
  # boxes without one. Built in Docker (zig cross-compiles both
  # architectures from pinned, checksummed sources), on a hosted runner,
  # which has Docker, for the release and macos jobs to download.
  tmux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The sources are pinned in build-tmux.sh, so the binaries only change
      # with it. tmux-cache.yml keeps them cached on main, which a tag's run
      # can read; build-tmux.sh keeps binaries it finds, so a hit skips the
      # Docker build (about 6 minutes).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            bin/tmux-linux-amd64
            bin/tmux-linux-arm64
          key: tmux-${{ hashFiles('scripts/build-tmux.sh') }}
      - run: scripts/build-tmux.sh bin amd64 arm64
      - name: Check they run
        run: |
          file bin/tmux-linux-amd64 bin/tmux-linux-arm64
          bin/tmux-linux-amd64 -V
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux
          path: |
            bin/tmux-linux-amd64
            bin/tmux-linux-arm64
          if-no-files-found: error

  release:
    needs: [tmux]
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tmux
          path: bin
      - run: chmod +x bin/tmux-linux-amd64 bin/tmux-linux-arm64
      - name: Build archives
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Check the stamped version
        run: |
          tar -xzf dist/berthd-linux-amd64.tar.gz -C "$RUNNER_TEMP" berthd
          "$RUNNER_TEMP/berthd" version | tee /dev/stderr | grep -q "^berthd $GITHUB_REF_NAME "
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            # A draft until the macos job uploads the app's feed: GitHub's
            # "latest" link skips drafts, so installed apps and the install
            # script keep using the last full release meanwhile, instead of a
            # latest.json that 404s.
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --draft --title "Shipyard $TAG" --generate-notes
          fi

  macos:
    # After the release job, which has made the release by then; it takes
    # Shipyard's tmux from the tmux job, since a Mac runner has no Docker. Safe to
    # re-run: it skips when the release's latest.json already announces this
    # version (scripts/publish.sh uploaded it, or an earlier run did), and
    # otherwise replaces only its own four assets, the feed last, so the feed
    # never points at an archive that is not there yet.
    needs: [tmux, release]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The token stays out of .git/config and the build's environment: only
      # the two steps that talk to the release get it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Is the app already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published means the release's latest.json announces this version.
          if gh release download "$TAG" --pattern latest.json --output - 2>/dev/null |
            python3 -c 'import json, os, sys; sys.exit(json.load(sys.stdin).get("version") != os.environ["TAG"][1:])' 2>/dev/null; then
            echo "::notice::$TAG's latest.json already announces this version; not building the app again"
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.published != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.published.outputs.published != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - if: steps.published.outputs.published != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # main's warm caches (release-cache.yml): read here, never written,
      # since a tag's caches serve no later tag.
      - if: steps.published.outputs.published != 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-mac-release-${{ hashFiles('go.sum') }}-
          restore-keys: |
            go-mac-release-${{ hashFiles('go.sum') }}-
            go-mac-release-
      - if: steps.published.outputs.published != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: mac-release
          save-if: false
      - name: Install tools
        if: steps.published.outputs.published != 'true'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          brew install minisign
          # spctl's verdict is a check below; with assessments off it
          # would accept anything.
          sudo spctl --master-enable || true
          spctl --status
      - if: steps.published.outputs.published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tmux
          path: bin
      - if: steps.published.outputs.published != 'true'
        run: chmod +x bin/tmux-linux-amd64 bin/tmux-linux-arm64
      - name: Install the app's dependencies
        if: steps.published.outputs.published != 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.published.outputs.published != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/berth-signing.keychain-db"
          cert="$RUNNER_TEMP/berth-signing.p12"
          echo "KEYCHAIN_PATH=$keychain" >>"$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # The Developer ID intermediate, in case the .p12 left it out.
          if curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          fi
          # Let codesign use the key without a prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          # codesign searches the user's keychain list: put this one first.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application identity (export the certificate with its private key)"
            exit 1
          fi
          echo "Signing as $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: Write the App Store Connect API key
        if: steps.published.outputs.published != 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/berth-notary.p8"
          if grep -q "BEGIN PRIVATE KEY" <<<"$APPLE_API_KEY_P8"; then
            printf '%s\n' "$APPLE_API_KEY_P8" >"$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode >"$key"
          fi
          echo "APPLE_API_KEY_PATH=$key" >>"$GITHUB_ENV"
      - name: Build, sign, notarize and check the app
        if: steps.published.outputs.published != 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: scripts/mac-release.sh "$TAG"
      - name: Add the app to the release
        if: steps.published.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          # scripts/publish.sh may have published it from a Mac meanwhile.
          if gh release download "$TAG" --pattern latest.json --output - 2>/dev/null |
            python3 -c 'import json, os, sys; sys.exit(json.load(sys.stdin).get("version") != os.environ["TAG"][1:])' 2>/dev/null; then
            echo "::notice::$TAG's latest.json appeared while this built; leaving the published app alone"
            exit 0
          fi
          gh release upload "$TAG" --clobber \
            dist/mac/Berth-macos-universal.dmg \
            dist/mac/Berth-macos-universal.app.tar.gz \
            dist/mac/Berth-macos-universal.app.tar.gz.sig
          gh release upload "$TAG" --clobber dist/mac/latest.json
      - name: Remove the keychain and the API key
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/berth-notary.p8" "$RUNNER_TEMP/berth-signing.p12"

  linux:
    # The Linux app, an alpha: x86_64 only for now. Built on 22.04 so its
    # AppImage runs on distributions with an older glibc too. Safe to re-run:
    # it replaces only its own assets, which no feed points at until the
    # feed job has checked they are there.
    needs: [tmux, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file
          # Ubuntu 22.04 has no minisign package: the static build from its
          # release, pinned by checksum, checks the updater signature.
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          sudo install -m 0755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: linux-release
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tmux
          path: bin
      - run: chmod +x bin/tmux-linux-amd64 bin/tmux-linux-arm64
      - name: Install the app's dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build and check the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy is an AppImage itself; this runs it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/linux-release.sh "$TAG"
      - name: Add the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          shopt -s nullglob
          gh release upload "$TAG" --clobber dist/linux/Berth-linux-*-alpha.AppImage dist/linux/Berth-linux-*-alpha.deb dist/linux/*.sig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-linux
          path: dist/linux/latest-linux.json
          if-no-files-found: error

  feed:
    # After the Mac and Linux jobs, whichever finished first, and the checks:
    # the Mac's latest.json gets the Linux entries, then the release becomes
    # "latest". Runs when the Mac app is built even if the Linux build
    # failed; then the feed stays the Mac's alone. Never when a check failed:
    # the release stays a draft.
    needs: [macos, linux, checks]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: needs.linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latest-linux
          path: ${{ runner.temp }}/feed
      - name: Add the Linux app to latest.json
        if: needs.linux.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/feed"
          gh release download "$TAG" --pattern latest.json --output "$dir/latest.json" --clobber
          # The Mac's feed for this very version, never an older one.
          python3 -c 'import json, os, sys; sys.exit(json.load(open(sys.argv[1])).get("version") != os.environ["TAG"][1:])' "$dir/latest.json" ||
            { echo "::error::$TAG's latest.json is not for $TAG"; exit 1; }
          gh release view "$TAG" --json assets --jq '.assets[].name' >"$dir/assets"
          scripts/merge-feed.py "$dir/latest.json" "$dir/latest-linux.json" --assets "$dir/assets" >"$dir/merged.json"
          cp "$dir/merged.json" "$dir/latest.json"
          gh release upload "$TAG" --clobber "$dir/latest.json"
      - if: needs.linux.result != 'success'
        run: echo "::warning::The Linux app was not built; latest.json stays the Mac's alone"
      - name: Publish the release
        # Last: the feed and the apps are up, so it can become "latest".
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
